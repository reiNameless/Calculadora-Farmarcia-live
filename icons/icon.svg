<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b57d0"/>
      <stop offset="100%" stop-color="#0842a0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo redondeado suave -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Símbolo de Calculadora y Cruz de Farmacia -->
  <g filter="url(#shadow)">
    <!-- Marco de Calculadora -->
    <rect x="100" y="80" width="312" height="352" rx="36" fill="#ffffff"/>
    
    <!-- Pantalla de la calculadora -->
    <rect x="136" y="120" width="240" height="74" rx="16" fill="#e8f0fe"/>
    <text x="356" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#0b57d0" text-anchor="end">$0.00</text>

    <!-- Cruz Médica / Farmacéutica en el centro -->
    <g fill="#146c2e">
      <rect x="236" y="224" width="40" height="96" rx="8"/>
      <rect x="208" y="252" width="96" height="40" rx="8"/>
    </g>

    <!-- Botones estilizados de calculadora -->
    <circle cx="166" cy="364" r="22" fill="#0b57d0"/>
    <text x="166" y="373" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <circle cx="256" cy="364" r="22" fill="#0b57d0"/>
    <text x="256" y="371" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">%</text>

    <circle cx="346" cy="364" r="22" fill="#146c2e"/>
    <text x="346" y="372" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
  </g>
</svg>
